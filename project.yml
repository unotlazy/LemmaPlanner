name: LemmaPlanner
options:
  bundleIdPrefix: com.lemmacollegecounseling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BGF646GHAB
targets:
  LemmaPlanner:
    type: application
    platform: iOS
    sources:
      - LemmaPlanner
    # lets the link in a confirmation email open the app; the site lists the
    # app in .well-known/apple-app-site-association
    entitlements:
      path: LemmaPlanner/LemmaPlanner.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:lemmacollegecounseling.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lemmacollegecounseling.planner
        PRODUCT_NAME: LemmaPlanner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lemma Planner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Lemma Planner adds program deadlines to your calendar when you ask it to.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  LemmaPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LemmaPlannerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LemmaPlanner
schemes:
  LemmaPlanner:
    build:
      targets:
        LemmaPlanner: all
        LemmaPlannerTests: [test]
    test:
      targets:
        - LemmaPlannerTests
